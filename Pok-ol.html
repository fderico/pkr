(function(){
// ============================================================
//  GIOCO.JS — Controller: collega motore, bot e interfaccia
// ============================================================
//
//  Questo è il "direttore d'orchestra" della versione offline.
//  Non contiene regole di poker (stanno nel motore) né grafica
//  (sta nell'HTML): si limita a far girare la partita, chiedere
//  ai bot la loro mossa e aspettare quella dell'umano.
//
//  È volutamente semplice: quando arriveremo all'online, gran parte
//  di questa logica di "chi gioca adesso" verrà ripensata per il
//  modello host. Per ora serve solo a farci giocare offline.
// ============================================================

class GiocoOffline {
  // config:
  //   umani:  array di id umani (di solito ["Tu"])
  //   bot:    array di { id, livello }
  //   stackIniziale, buiCrescenti
  //   onAggiorna: callback chiamata a ogni cambiamento di stato
  //   onFineMano, onFinePartita, onLog
  constructor(config) {
    this.config = config;
    this.stackIniziale = config.stackIniziale ?? 1000;

    // Costruisci la lista giocatori: prima gli umani, poi i bot,
    // mescolando l'ordine dei posti in modo stabile.
    const giocatori = [];
    for (const id of config.umani) giocatori.push({ id, stack: this.stackIniziale });
    for (const b of config.bot) giocatori.push({ id: b.id, stack: this.stackIniziale });

    this.umani = new Set(config.umani);
    this.botMap = {};
    for (const b of config.bot) this.botMap[b.id] = window.PokerBot.creaBot(b.livello);

    this.onAggiorna    = config.onAggiorna    || (() => {});
    this.onFineMano    = config.onFineMano    || (() => {});
    this.onFinePartita = config.onFinePartita || (() => {});
    this.onLog         = config.onLog         || (() => {});

    this.partita = new window.PokerPartita.Partita(giocatori, {
      buiCrescenti: config.buiCrescenti ?? false,
      log: (msg, tipo) => this.onLog(msg, tipo),
    });

    this.mano = null;
    this.inAttesaUmano = false;
  }

  // Avvia la prossima mano (o segnala fine partita)
  prossimaMano() {
    this.mano = this.partita.nuovaMano();
    if (!this.mano) {
      this.onFinePartita(this.partita.vincitore);
      return;
    }
    this.onAggiorna();
    // Piccola pausa per far "respirare" l'interfaccia, poi procedi
    setTimeout(() => this._passo(), 500);
  }

  // Il cuore: guarda a chi tocca. Se è un bot, gioca da solo dopo una
  // pausa; se è un umano, si ferma e aspetta l'input dall'interfaccia.
  _passo() {
    if (!this.mano || this.mano.fase === "finita") {
      this._concludiMano();
      return;
    }
    const g = this.mano.giocatoreDiTurno();
    if (!g) { this._concludiMano(); return; }

    if (this.umani.has(g.id)) {
      // Turno umano: aspetta. L'interfaccia chiamerà azioneUmano().
      this.inAttesaUmano = true;
      this.onAggiorna();
    } else {
      // Turno bot: calcola e gioca dopo una breve pausa "umana"
      this.inAttesaUmano = false;
      this.onAggiorna();
      setTimeout(() => {
        const azione = this.botMap[g.id](this.mano, g.id, Math.random);
        const scelta = azione || { tipo: "fold" };
        this.mano.esegui(scelta.tipo, scelta.importoTo);
        this.onAggiorna();
        this._passo();
      }, 700 + Math.random() * 500);
    }
  }

  // Chiamata dall'interfaccia quando l'umano sceglie un'azione
  azioneUmano(tipo, importoTo = null) {
    if (!this.inAttesaUmano || !this.mano) return false;
    const g = this.mano.giocatoreDiTurno();
    if (!g || !this.umani.has(g.id)) return false;

    const ok = this.mano.esegui(tipo, importoTo);
    if (!ok) return false;

    this.inAttesaUmano = false;
    this.onAggiorna();
    this._passo();
    return true;
  }

  _concludiMano() {
    this.partita.concludiMano();
    this.onAggiorna();
    this.onFineMano(this.mano);
    // La prossima mano parte su richiesta dell'interfaccia (pulsante)
  }

  // Stato comodo per l'interfaccia
  statoUI() {
    if (!this.mano) return null;
    const g = this.mano.giocatoreDiTurno();
    return {
      mano: this.mano,
      turnoDi: g ? g.id : null,
      turnoUmano: g ? this.umani.has(g.id) : false,
      azioni: this.inAttesaUmano ? this.mano.azioniLegali() : null,
      partitaFinita: this.partita.finita,
      vincitorePartita: this.partita.vincitore,
    };
  }
}

window.GiocoOffline = GiocoOffline;

})();
</script>

<script>
// ============================================================
//  COLLEGAMENTO MOTORE ↔ INTERFACCIA A TAVOLO OVALE
// ============================================================
let gioco = null;         // motore autoritativo locale: presente in modalità locale E host, null in modalità client
let ultimoStatoRicevuto = null; // ultimo `st` passato a render(): serve al pannello raise per ridisegnarsi da solo (specie su client, dove non c'è `gioco`)
let layoutPosti = null;   // calcolato una volta a inizio partita, mai più
let idsGiocatori = [];    // tutti gli id seduti al tavolo, elimintati inclusi
let logBuffer = [];
let ultimaAzione = {};    // id giocatore -> testo dell'ultima azione in questo giro
let mostraPotOdds = false; // toggle scelto in setup: mostra la % minima di vittoria per il call
let miaIdentita = "Tu";   // l'id con cui QUESTO dispositivo compare al tavolo (sempre in basso)
let modalitaGioco = "locale"; // "locale" | "host" | "client" — instrada azioni e stato
const SEMI_ROSSI = new Set([1, 2]);
const NOMI_FASE = { preflop:"Pre-flop", flop:"Flop", turn:"Turn", river:"River", showdown:"Showdown", finita:"Mano conclusa" };

// Ruota un elenco di giocatori in modo che `mieId` compaia per primo,
// mantenendo l'ordine relativo degli altri: ogni dispositivo vede se
// stesso in basso, ma il giro attorno al tavolo resta coerente per tutti.
function ruotaSuIdentita(elenco, mieId) {
  const idx = elenco.findIndex(g => g.id === mieId);
  if (idx <= 0) return elenco.slice();
  return [...elenco.slice(idx), ...elenco.slice(0, idx)];
}

// Log condiviso da locale, host e client: aggiorna il buffer di log,
// le etichette di stato per giocatore, e mostra l'annuncio a centro
// tavolo (inizio mano / cambio fase). `extra` porta le informazioni
// che il motore live conosce ma il testo del log da solo non contiene
// (numero mano, bui, fase) — calcolate al volo in locale/host, ricevute
// via rete dal client.
function gestisciLog(msg, tipo, extra) {
  logBuffer.push({ msg, tipo });
  renderLog();
  if (tipo === "turno" && /^Mano iniziata/.test(msg)) {
    ultimaAzione = {};
    if (extra && extra.bui) {
      mostraAnnuncio(`Mano ${extra.numeroMano ?? ""}`.trim(), `Piccolo buio ${extra.bui.sb} · Grande buio ${extra.bui.bb}`);
    }
  } else if (tipo === "turno" && /^(FLOP|TURN|RIVER):/.test(msg)) {
    ultimaAzione = {};
    const faseAttuale = extra && extra.faseAttuale;
    if (faseAttuale) mostraAnnuncio(NOMI_FASE[faseAttuale] || faseAttuale);
  }
  const parsed = parseAzioneLog(msg, tipo);
  if (parsed) ultimaAzione[parsed.id] = parsed.testo;
}

// Legge una riga di log del motore e, se descrive un'azione o un buio,
// restituisce { id, testo } pronto da mostrare vicino al giocatore.
function parseAzioneLog(msg, tipo) {
  let m;
  if (tipo === "mossa") {
    if (m = msg.match(/^(.+) passa \(fold\)$/)) return { id: m[1], testo: "Passato" };
    if (m = msg.match(/^(.+) bussa \(check\)$/)) return { id: m[1], testo: "Check" };
    if (m = msg.match(/^(.+) vede \(call (\d+)\)$/)) return { id: m[1], testo: `Visto ${m[2]}` };
    if (m = msg.match(/^(.+) rilancia a (\d+)$/)) return { id: m[1], testo: `Rilancia ${m[2]}` };
  } else if (tipo === "dado") {
    if (m = msg.match(/^(.+) versa (small blind|big blind): (\d+)$/)) {
      const nome = m[2] === "small blind" ? "Piccolo buio" : "Grande buio";
      return { id: m[1], testo: `${nome} ${m[3]}` };
    }
  }
  return null;
}

// Testo/aspetto da mostrare per un giocatore, dato lo stato corrente della mano
function statoGiocatore(g) {
  if (g.foldato) return "Passato";
  if (g.allIn && !ultimaAzione[g.id]) return "All-in";
  return ultimaAzione[g.id] || "In attesa";
}

// ---- Selettori a pillole (bot / livello) ----
function agganciaScelta(containerId) {
  const cont = document.getElementById(containerId);
  cont.querySelectorAll(".scelta-btn").forEach(b => {
    b.onclick = () => {
      cont.querySelectorAll(".scelta-btn").forEach(x => x.classList.remove("attivo"));
      b.classList.add("attivo");
    };
  });
}
agganciaScelta("scelta-livello");

function valoreScelto(containerId) {
  return document.querySelector(`#${containerId} .scelta-btn.attivo`).dataset.v;
}

// ---- Stepper numero bot: range 1-9 (totale 2-10 giocatori al tavolo) ----
let nBotCorrente = 2;
function aggiornaStepperNbot() {
  document.getElementById("nbot-val").textContent = nBotCorrente;
  document.getElementById("nbot-totale").textContent = `${nBotCorrente + 1} giocatori al tavolo`;
  const stepper = document.getElementById("stepper-nbot");
  stepper.querySelectorAll(".stepper-btn")[0].disabled = nBotCorrente <= 1;
  stepper.querySelectorAll(".stepper-btn")[1].disabled = nBotCorrente >= 9;
}
function cambiaNbot(delta) {
  nBotCorrente = Math.max(1, Math.min(9, nBotCorrente + delta));
  aggiornaStepperNbot();
}
aggiornaStepperNbot();

// ---- Modalità: locale / ospita online / unisciti ----
let modalita = "locale";
let rete = null; // istanza HostRete o ClientRete, quando online

agganciaScelta("scelta-modalita");
document.getElementById("scelta-modalita").querySelectorAll(".scelta-btn").forEach(b => {
  b.addEventListener("click", () => impostaModalita(b.dataset.v));
});

function impostaModalita(m) {
  modalita = m;
  document.getElementById("config-locale").style.display = (m === "unisciti") ? "none" : "";
  // Il campo nome serve sia per ospitare (l'host sceglie come chiamarsi
  // agli occhi degli altri) sia per unirsi; solo il locale non ne ha bisogno.
  document.getElementById("config-unisciti").style.display = (m === "locale") ? "none" : "";
  document.getElementById("config-unisciti-codice").style.display = (m === "unisciti") ? "" : "none";
  const btn = document.getElementById("btn-avvia-setup");
  btn.textContent = m === "locale" ? "Siediti al tavolo" : (m === "ospita" ? "Crea stanza" : "Connetti");
}

function gestisciAvvio() {
  if (modalita === "locale") { avvia(); return; }
  if (modalita === "ospita") { creaStanza(); return; }
  if (modalita === "unisciti") { connettiStanza(); return; }
}

// ---- Lobby: schermata condivisa da host e client -----------
function mostraLobby(sottotitolo) {
  document.getElementById("setup").style.display = "none";
  document.getElementById("lobby-schermo").style.display = "flex";
  document.getElementById("lobby-sottotitolo").textContent = sottotitolo;
  document.getElementById("lobby-codice").textContent = "";
  document.getElementById("lobby-lista").innerHTML = "";
  document.getElementById("lobby-msg").textContent = "";
  document.getElementById("btn-avvia-online").style.display = "none";
}

function annullaOnline() {
  if (rete) { rete.chiudi(); rete = null; }
  document.getElementById("lobby-schermo").style.display = "none";
  document.getElementById("setup").style.display = "flex";
}

// ---- Lato host: crea la stanza e aspetta i giocatori --------
function creaStanza() {
  mostraLobby("Condividi questo codice con gli altri giocatori");
  rete = new window.PokerRete.HostRete(gestisciEventoReteHost);
}

function gestisciEventoReteHost(ev) {
  if (ev.tipo === "pronto") {
    document.getElementById("lobby-codice").textContent = ev.codice;
    document.getElementById("lobby-msg").textContent = "In attesa di altri giocatori…";
    document.getElementById("btn-avvia-online").style.display = "";
  } else if (ev.tipo === "errore") {
    document.getElementById("lobby-msg").textContent = "Errore di connessione (" + ev.errore + "). Riprova.";
  } else if (ev.tipo === "giocatoreConnesso" || ev.tipo === "giocatoreDisconnesso") {
    aggiornaListaLobbyHost();
    rete.inviaATutti({ tipo: "lobby", giocatori: rete.elencoGiocatori().map(g => g.nome) });
  } else if (ev.tipo === "messaggio") {
    gestisciMessaggioDaClient(ev.peerId, ev.dati);
  }
}

// Nome scelto dall'host per sé stesso (default "Host" se vuoto)
function nomeHostScelto() {
  return (document.getElementById("cfg-nome").value || "").trim() || "Host";
}

function aggiornaListaLobbyHost() {
  const lista = document.getElementById("lobby-lista");
  const giocatori = rete.elencoGiocatori();
  let html = `<div class="lobby-giocatore"><span><span class="puntino"></span>${nomeHostScelto()} (host)</span></div>`;
  html += giocatori.map(g =>
    `<div class="lobby-giocatore"><span><span class="puntino"></span>${g.nome || "In attesa…"}</span></div>`
  ).join("");
  lista.innerHTML = html;

  // Quanti bot entreranno davvero: se la stanza si riempie di umani,
  // il numero di bot scende automaticamente per non superare i 10 posti totali.
  const maxBot = Math.max(0, 9 - giocatori.length);
  const nbotEffettivi = Math.min(nBotCorrente, maxBot);
  const notaBot = nbotEffettivi < nBotCorrente
    ? ` — bot in partita: ${nbotEffettivi} (ridotti da ${nBotCorrente} per fare posto ai giocatori)`
    : ` — bot in partita: ${nbotEffettivi}`;
  document.getElementById("lobby-msg").textContent =
    (giocatori.length === 0 ? "In attesa di altri giocatori…" : `${giocatori.length} giocatore/i connesso/i.`) + notaBot;
}

// Trasmette ai client lo stato pubblico completo dopo ogni cambiamento.
// Non c'è filtraggio delle carte coperte altrui (nessun requisito
// anticheat): ogni dispositivo mostra scoperte solo le proprie per
// convenzione dell'interfaccia, non perché l'host gliele nasconda.
function trasmettiStatoATuttiIClient() {
  if (!rete || !gioco || !gioco.mano) return;
  rete.inviaATutti({
    tipo: "stato",
    stato: gioco.mano.stato(false),
    azioni: gioco.inAttesaUmano ? gioco.mano.azioniLegali() : null,
    partitaFinita: gioco.partita.finita,
    vincitorePartita: gioco.partita.vincitore,
  });
}

// Instrada un'azione ricevuta da un client verso il motore, solo se è
// davvero il suo turno (l'host resta l'unica autorità).
function gestisciMessaggioDaClient(peerId, dati) {
  if (!dati || !gioco || !gioco.mano) return;
  if (dati.tipo === "azione") {
    const rec = rete.connessioni.get(peerId);
    const g = gioco.mano.giocatoreDiTurno();
    if (!rec || !g || g.id !== rec.nome) return; // non è il suo turno: ignora
    gioco.azioneUmano(dati.azione.tipo, dati.azione.importoTo ?? null);
  }
}

function avviaPartitaOnline() {
  if (!rete) return;
  const clientsInfo = rete.elencoGiocatori();
  const clientNames = clientsInfo.map(c => c.nome);

  const nbotRichiesti = nBotCorrente;
  const maxBotConsentiti = Math.max(0, 9 - clientNames.length);
  const nbotEffettivi = Math.min(nbotRichiesti, maxBotConsentiti);

  const livello = valoreScelto("scelta-livello");
  const stack = parseInt(document.getElementById("cfg-stack").value) || 1000;
  const bui = document.getElementById("cfg-bui").checked;
  mostraPotOdds = document.getElementById("cfg-potodds").checked;

  miaIdentita = nomeHostScelto();
  modalitaGioco = "host";

  const bot = [];
  for (let i = 0; i < nbotEffettivi; i++) bot.push({ id: "Bot " + (i + 1), livello });

  // Ordine "di motore", fisso per tutta la partita: host, poi i client
  // nell'ordine in cui si sono connessi, poi i bot. Ogni dispositivo lo
  // ruoterà per vedere sé stesso in basso (vedi ruotaSuIdentita).
  const ordineGiocatori = [{ id: miaIdentita }, ...clientsInfo.map(c => ({ id: c.nome })), ...bot.map(b => ({ id: b.id }))];
  const ordineVisuale = ruotaSuIdentita(ordineGiocatori, miaIdentita);
  layoutPosti = window.PokerLayout.calcolaLayout(ordineVisuale);
  idsGiocatori = ordineVisuale.map(g => g.id);

  logBuffer = [];
  ultimaAzione = {};

  gioco = new GiocoOffline({
    umani: [miaIdentita, ...clientNames],
    bot,
    stackIniziale: stack,
    buiCrescenti: bui,
    onAggiorna: () => { render(gioco.statoUI()); trasmettiStatoATuttiIClient(); },
    onFineMano: (mano) => {
      mostraFineMano(mano);
      if (rete) rete.inviaATutti({ tipo: "fineMano", stato: mano.stato(false) });
    },
    onFinePartita: (vincitore) => {
      mostraFinePartita(vincitore);
      if (rete) rete.inviaATutti({ tipo: "finePartita", vincitore });
    },
    onLog: (msg, tipo) => {
      const extra = {
        numeroMano: gioco.partita.numeroMano,
        bui: gioco.partita.buiAttuali(),
        faseAttuale: gioco.mano ? gioco.mano.fase : null,
      };
      gestisciLog(msg, tipo, extra);
      if (rete) rete.inviaATutti({ tipo: "log", msg, tipoLog: tipo, extra });
    },
  });

  document.getElementById("lobby-schermo").style.display = "none";
  document.getElementById("tavolo-schermo").style.display = "flex";
  costruisciPostiDOM(ordineVisuale);
  rete.inviaATutti({ tipo: "iniziaPartita", ordine: ordineGiocatori.map(g => g.id) });
  gioco.prossimaMano();
}

// ---- Lato client: si connette a una stanza esistente ---------
function connettiStanza() {
  const nome = (document.getElementById("cfg-nome").value || "").trim() || "Giocatore";
  let codice = (document.getElementById("cfg-codice").value || "").trim().toUpperCase();
  if (!codice) { alert("Inserisci il codice della stanza"); return; }
  codice = codice.replace(/^PK-?/, "");
  miaIdentita = nome;
  mostraLobby("Connessione in corso…");
  rete = new window.PokerRete.ClientRete("PK-" + codice, nome, gestisciEventoReteClient);
}

function gestisciEventoReteClient(ev) {
  if (ev.tipo === "connesso") {
    document.getElementById("lobby-msg").textContent = "Connesso. In attesa che l'host avvii la partita…";
  } else if (ev.tipo === "errore") {
    document.getElementById("lobby-msg").textContent = "Impossibile connettersi: controlla il codice e riprova.";
  } else if (ev.tipo === "disconnesso") {
    document.getElementById("lobby-msg").textContent = "Connessione con l'host interrotta.";
  } else if (ev.tipo === "messaggio") {
    gestisciMessaggioDaHost(ev.dati);
  }
}

// Ricostruisce, da un messaggio "stato" ricevuto dall'host, lo stesso
// oggetto `st` che render()/renderAzioni() si aspettano — la forma è
// identica a quella prodotta da GiocoOffline.statoUI() in locale.
function vistaDaStatoRete(msg) {
  const manoVista = msg.stato;
  manoVista.pizzardiVincite = manoVista.vincite; // allinea il nome campo atteso da render/mostraFineMano
  const turnoDi = (manoVista.turno != null && manoVista.giocatori[manoVista.turno])
    ? manoVista.giocatori[manoVista.turno].id : null;
  return {
    mano: manoVista,
    turnoDi,
    turnoUmano: turnoDi === miaIdentita,
    azioni: msg.azioni,
    partitaFinita: !!msg.partitaFinita,
    vincitorePartita: msg.vincitorePartita,
  };
}

function gestisciMessaggioDaHost(dati) {
  if (!dati) return;
  if (dati.tipo === "lobby") {
    const lista = document.getElementById("lobby-lista");
    lista.innerHTML = dati.giocatori.map(nome =>
      `<div class="lobby-giocatore"><span><span class="puntino"></span>${nome}</span></div>`
    ).join("");
  } else if (dati.tipo === "iniziaPartita") {
    passaAlTavoloClient(dati.ordine);
  } else if (dati.tipo === "stato") {
    render(vistaDaStatoRete(dati));
  } else if (dati.tipo === "fineMano") {
    const st = vistaDaStatoRete({ stato: dati.stato, azioni: null, partitaFinita: false });
    render(st);
    mostraFineMano(st.mano);
  } else if (dati.tipo === "finePartita") {
    mostraFinePartita(dati.vincitore);
  } else if (dati.tipo === "log") {
    gestisciLog(dati.msg, dati.tipoLog, dati.extra);
  }
}

function passaAlTavoloClient(ordineIds) {
  modalitaGioco = "client";
  const ordineGiocatori = ordineIds.map(id => ({ id }));
  const ordineVisuale = ruotaSuIdentita(ordineGiocatori, miaIdentita);
  layoutPosti = window.PokerLayout.calcolaLayout(ordineVisuale);
  idsGiocatori = ordineVisuale.map(g => g.id);
  logBuffer = [];
  ultimaAzione = {};

  document.getElementById("lobby-schermo").style.display = "none";
  document.getElementById("tavolo-schermo").style.display = "flex";
  costruisciPostiDOM(ordineVisuale);
}

function avvia() {
  miaIdentita = "Tu";
  modalitaGioco = "locale";

  const nbot = nBotCorrente;
  const livello = valoreScelto("scelta-livello");
  const stack = parseInt(document.getElementById("cfg-stack").value) || 1000;
  const bui = document.getElementById("cfg-bui").checked;
  mostraPotOdds = document.getElementById("cfg-potodds").checked;

  const bot = [];
  for (let i = 0; i < nbot; i++) bot.push({ id: "Bot " + (i + 1), livello });

  // Layout calcolato UNA SOLA VOLTA qui, su umano + bot nell'ordine di creazione.
  const ordineGiocatori = [{ id: "Tu" }, ...bot.map(b => ({ id: b.id }))];
  layoutPosti = window.PokerLayout.calcolaLayout(ordineGiocatori);
  idsGiocatori = ordineGiocatori.map(g => g.id);

  logBuffer = [];
  ultimaAzione = {};
  gioco = new GiocoOffline({
    umani: ["Tu"],
    bot,
    stackIniziale: stack,
    buiCrescenti: bui,
    onAggiorna: () => render(gioco.statoUI()),
    onFineMano: mostraFineMano,
    onFinePartita: mostraFinePartita,
    onLog: (msg, tipo) => {
      const extra = {
        numeroMano: gioco.partita.numeroMano,
        bui: gioco.partita.buiAttuali(),
        faseAttuale: gioco.mano ? gioco.mano.fase : null,
      };
      gestisciLog(msg, tipo, extra);
    },
  });

  document.getElementById("setup").style.display = "none";
  document.getElementById("tavolo-schermo").style.display = "flex";
  costruisciPostiDOM(ordineGiocatori);
  gioco.prossimaMano();
}

function tornaAlSetup() {
  document.getElementById("tavolo-schermo").style.display = "none";
  document.getElementById("setup").style.display = "flex";
  document.getElementById("campo").querySelectorAll(".posto").forEach(e => e.remove());
  document.getElementById("barra-fine").style.display = "none";
  document.getElementById("btn-prossima").style.display = "";
  gioco = null;
  if (rete) { rete.chiudi(); rete = null; }
  modalitaGioco = "locale";
  miaIdentita = "Tu";
}

function prossimaMano() {
  if (modalitaGioco === "client") return; // solo l'host decide quando parte la mano successiva
  if (!gioco) return;
  document.getElementById("barra-fine").style.display = "none";
  gioco.prossimaMano();
}

// ---- Costruzione statica dei nodi DOM per ogni posto (una volta) ----
function costruisciPostiDOM(ordineGiocatori) {
  const campo = document.getElementById("campo");
  campo.querySelectorAll(".posto").forEach(e => e.remove());

  ordineGiocatori.forEach((g, i) => {
    const pos = layoutPosti[i];
    const div = document.createElement("div");
    const èUmano = g.id === miaIdentita;
    div.className = "posto" + (èUmano ? " umano" : "") + (!èUmano ? " lato-" + pos.lato : "");
    div.id = "posto-" + cssId(g.id);
    div.style.left = pos.xPercent + "%";
    div.style.top = pos.yPercent + "%";
    if (èUmano) {
      // Badge sopra le proprie carte (D/SB/BB/ALL-IN in cima al posto), poi
      // l'etichetta della combinazione attuale (aggiornata mano a mano che
      // escono le carte comunitarie), poi le carte.
      div.innerHTML = `
        <div class="badge-riga"></div>
        <div class="combo-attuale" id="combo-attuale"></div>
        <div class="carte-posto"></div>
        <div class="targhetta">
          <span class="nome">${g.id}</span>
          <span class="fiches"></span>
        </div>
        <div class="stato-azione" id="stato-${cssId(g.id)}">In attesa</div>
      `;
    } else if (pos.lato === "sopra") {
      // Lato sopra: badge come riga separata TRA le carte e la targhetta.
      div.innerHTML = `
        <div class="carte-posto"></div>
        <div class="badge-riga"></div>
        <div class="targhetta">
          <span class="nome">${g.id}</span>
          <span class="fiches"></span>
        </div>
        <div class="stato-azione" id="stato-${cssId(g.id)}">In attesa</div>
      `;
    } else if (pos.lato === "destra") {
      // Lato destra: badge a SINISTRA delle carte (ordine invertito
      // rispetto al lato sinistra, dove il badge sta a destra).
      div.innerHTML = `
        <div class="riga-carte-badge">
          <div class="badge-riga"></div>
          <div class="carte-posto"></div>
        </div>
        <div class="targhetta">
          <span class="nome">${g.id}</span>
          <span class="fiches"></span>
        </div>
        <div class="stato-azione" id="stato-${cssId(g.id)}">In attesa</div>
      `;
    } else {
      // Lato sinistra: badge a destra delle carte (comportamento originale).
      div.innerHTML = `
        <div class="riga-carte-badge">
          <div class="carte-posto"></div>
          <div class="badge-riga"></div>
        </div>
        <div class="targhetta">
          <span class="nome">${g.id}</span>
          <span class="fiches"></span>
        </div>
        <div class="stato-azione" id="stato-${cssId(g.id)}">In attesa</div>
      `;
    }
    campo.appendChild(div);
  });
}

function cssId(id) { return id.replace(/\s+/g, "_"); }

// Mostra un annuncio temporaneo al centro del tavolo (titolo + riga opzionale
// di dettaglio), che scompare da solo in dissolvenza dopo ~2.6s.
// Ricrea il nodo ogni volta per far ripartire sempre l'animazione da capo,
// anche se un annuncio precedente è ancora in corso.
function mostraAnnuncio(titolo, sotto) {
  const overlay = document.getElementById("annuncio-overlay");
  overlay.innerHTML = "";
  const div = document.createElement("div");
  div.className = "annuncio";
  const elTitolo = document.createElement("div");
  elTitolo.className = "titolo";
  elTitolo.textContent = titolo;
  div.appendChild(elTitolo);
  if (sotto) {
    const elSotto = document.createElement("div");
    elSotto.className = "sotto";
    elSotto.textContent = sotto;
    div.appendChild(elSotto);
  }
  overlay.appendChild(div);
  elTitolo.addEventListener("animationend", () => { if (div.parentNode) div.remove(); });
}

// ---- Carte ----
function cartaHTML(carta, coperta, classe) {
  const cls = classe ? " " + classe : "";
  if (coperta) return `<div class="carta coperta${cls}"></div>`;
  if (!carta) return `<div class="carta vuota${cls}"></div>`;
  const V = window.PokerCarte.VALORI_SIMBOLI[carta.valore];
  const S = window.PokerCarte.SEMI_SIMBOLI[carta.seme];
  const rosso = SEMI_ROSSI.has(carta.seme) ? " rosso" : "";
  return `<div class="carta${rosso}${cls}"><span>${V}</span><span class="seme">${S}</span></div>`;
}

// ---- Render principale ----
// `st` ha sempre la stessa forma { mano, turnoDi, turnoUmano, azioni, partitaFinita,
// vincitorePartita }. In locale/host `mano` è l'istanza viva di Mano; su un client
// è l'oggetto piatto ricevuto via rete (stessa forma, vedi vistaDaStatoRete). Qui
// dentro si leggono solo proprietà, mai metodi, apposta per funzionare in entrambi i casi.
function render(st) {
  if (!st) return;
  ultimoStatoRicevuto = st;
  const mano = st.mano;

  document.getElementById("piatto-centro-val").textContent = mano.piatto;

  const com = document.getElementById("comunitarie");
  com.innerHTML = "";
  for (let i = 0; i < 5; i++) com.innerHTML += cartaHTML(mano.comunitarie[i] || null, false, "mini");

  const showdown = (mano.fase === "showdown" || mano.fase === "finita");

  const idsInMano = new Set(mano.giocatori.map(g => g.id));

  mano.giocatori.forEach((g, idx) => {
    const div = document.getElementById("posto-" + cssId(g.id));
    if (!div) return;
    const èTurno = st.turnoDi === g.id && !st.partitaFinita && mano.fase !== "finita";
    const èUmano = g.id === miaIdentita;
    const èDealer = idx === mano.dealerPos;
    const èSB = idx === mano.posSB;
    const èBB = idx === mano.posBB;

    div.classList.remove("eliminato");
    div.classList.toggle("turno", èTurno);
    div.classList.toggle("foldato", g.foldato);

    // Carte
    let carteHTML;
    if (èUmano) {
      carteHTML = g.carte.map(c => cartaHTML(c)).join("");
    } else if (showdown && !g.foldato) {
      carteHTML = g.carte.map(c => cartaHTML(c, false, "mini")).join("");
    } else {
      carteHTML = cartaHTML(null, true, "mini") + cartaHTML(null, true, "mini");
    }
    div.querySelector(".carte-posto").innerHTML = carteHTML;

    // Combo attuale (solo per l'umano): calcolata su hole card + comunitarie
    // visibili finora (0, 3, 4 o 5 carte). Il valutatore gestisce già bene
    // anche il caso con sole 2 carte (preflop → categoria "Carta alta" o
    // "Coppia" se le hole card sono già una coppia).
    if (èUmano) {
      const comboEl = document.getElementById("combo-attuale");
      if (comboEl) {
        if (g.foldato || !g.carte || g.carte.length < 2) {
          comboEl.textContent = "";
        } else {
          const carteValutabili = g.carte.concat(mano.comunitarie || []);
          const val = window.PokerValutatore.valuta(carteValutabili);
          comboEl.textContent = val.nome;
        }
      }
    }

    // Badge (dealer / SB / BB / all-in): tutti i posti hanno ormai un
    // contenitore .badge-riga dedicato (posizionato diversamente per
    // lato via CSS/markup), quindi il nome resta sempre pulito.
    let badge = "";
    if (èDealer) badge += `<span class="badge-mini dealer">D</span>`;
    if (èSB) badge += `<span class="badge-mini sb">SB</span>`;
    if (èBB) badge += `<span class="badge-mini bb">BB</span>`;
    if (g.allIn) badge += `<span class="badge-mini allin">ALL-IN</span>`;
    const nomeEl = div.querySelector(".nome");
    const badgeRigaEl = div.querySelector(".badge-riga");
    if (badgeRigaEl) {
      badgeRigaEl.innerHTML = badge;
      nomeEl.textContent = g.id;
    } else {
      nomeEl.innerHTML = `${g.id} ${badge}`;
    }

    div.querySelector(".fiches").textContent = g.stack;

    const statoEl = document.getElementById("stato-" + cssId(g.id));
    if (statoEl) {
      const testo = statoGiocatore(g);
      statoEl.textContent = testo;
      statoEl.classList.toggle("agito", testo !== "In attesa");
    }
  });

  // Giocatori eliminati: non fanno più parte della mano corrente, ma
  // restano seduti al tavolo. Puliamo il loro posto una volta per tutte
  // (niente più carte vecchie, niente più badge ALL-IN residuo).
  idsGiocatori.forEach(id => {
    if (idsInMano.has(id)) return;
    const div = document.getElementById("posto-" + cssId(id));
    if (!div) return;
    div.classList.add("eliminato");
    div.classList.remove("turno", "foldato");
    div.querySelector(".carte-posto").innerHTML =
      cartaHTML(null, false, "mini") + cartaHTML(null, false, "mini");
    div.querySelector(".nome").innerHTML = id;
    div.querySelector(".fiches").textContent = "0";
    const statoEl = document.getElementById("stato-" + cssId(id));
    if (statoEl) {
      statoEl.textContent = "Eliminato";
      statoEl.classList.remove("agito");
    }
  });

  renderAzioni(st);
}

// ---- Pannello azioni ----
// Stato del pannello di raise espanso: sopravvive ai re-render (che
// avvengono spesso, anche solo per un aggiornamento di stack altrui),
// così l'importo digitato dall'utente non si perde a ogni onAggiorna.
let raisePanelAperto = false;
let raiseValoreCorrente = 0;
let raiseSegnoPiu = true; // true = i tasti step sommano, false = sottraggono
const RAISE_STEP = [1, 10, 50, 100, 1000];

function renderAzioni(st) {
  const box = document.getElementById("pannello-azioni");
  const overlay = document.getElementById("raise-overlay");

  if (st.partitaFinita) {
    box.className = "";
    box.innerHTML = "";
    raisePanelAperto = false;
    overlay.classList.remove("aperto");
    return;
  }

  // Non basta "è il turno di un umano": deve essere il turno di QUESTO
  // dispositivo. In locale coincidono sempre; in host/client no — può
  // benissimo essere il turno di un altro giocatore umano connesso.
  const èIlMioTurno = st.turnoDi === miaIdentita;
  if (!èIlMioTurno || !st.azioni) {
    const chi = st.turnoDi || "…";
    box.className = "";
    box.innerHTML = `<span class="attesa">In attesa di ${chi}…</span>`;
    raisePanelAperto = false;
    overlay.classList.remove("aperto");
    return;
  }

  const a = st.azioni;

  // Se non è più possibile rilanciare (es. sono finito all-in con un call),
  // il pannello non ha più senso: richiudilo.
  if (!a.raise) raisePanelAperto = false;

  // I 3 (o 2) bottoni base restano SEMPRE disegnati, a larghezza uguale:
  // l'overlay raise è un layer separato che si sovrappone al tavolo,
  // non sostituisce questa riga di bottoni.
  const nBottoni = 1 + (a.check || a.call ? 1 : 0) + (a.raise ? 1 : 0);
  box.className = "griglia-base";
  box.style.setProperty("--n-azioni", nBottoni);
  let html = `<button class="btn-azione fold" onclick="azione('fold')">Fold</button>`;
  if (a.check) html += `<button class="btn-azione check" onclick="azione('check')">Check</button>`;
  if (a.call)  html += `<button class="btn-azione call" onclick="azione('call')">Call ${a.importoCall}</button>`;
  if (a.raise) html += `<button class="btn-azione raise" onclick="apriPannelloRaise(${a.minRaiseTo})">Raise</button>`;
  box.innerHTML = html;

  if (mostraPotOdds && a.call && a.importoCall > 0) {
    const mano = st.mano;
    const daPagare = a.importoCall;
    const potOdds = daPagare / (mano.piatto + daPagare);
    const pct = (potOdds * 100).toFixed(0);
    box.insertAdjacentHTML("beforeend",
      `<div class="pot-odds-hint">Pot odds: devi vincere almeno il <span class="pct">${pct}%</span> delle volte per convenire</div>`);
  }

  if (raisePanelAperto) {
    overlay.classList.add("aperto");
    overlay.innerHTML = htmlOverlayRaise(st, a);
    aggiornaValidazioneRaise(a);
  } else {
    overlay.classList.remove("aperto");
  }
}

// Apre il pannello raise, valorizzato subito al minimo legale (niente
// stato vuoto intermedio, come deciso in fase di mock).
function apriPannelloRaise(minRaiseTo) {
  raisePanelAperto = true;
  raiseValoreCorrente = minRaiseTo;
  raiseSegnoPiu = true;
  const st = gioco ? gioco.statoUI() : ultimoStatoRicevuto;
  if (st) renderAzioni(st);
}

function chiudiPannelloRaise() {
  raisePanelAperto = false;
  const st = gioco ? gioco.statoUI() : ultimoStatoRicevuto;
  if (st) renderAzioni(st);
}

// Costruisce la lista dei giocatori nell'ordine in cui agiscono nel giro
// (a partire dal dealer), non nell'ordine dei posti fisici sul tavolo —
// così è immediato vedere chi ha già parlato e chi deve ancora farlo.
function ordineDiTurnoDalDealer(mano) {
  const n = mano.giocatori.length;
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push(mano.giocatori[(mano.dealerPos + i) % n]);
  }
  return out;
}

function htmlCardGiocatore(g, mano, st) {
  const idx = mano.giocatori.indexOf(g);
  const èDealer = idx === mano.dealerPos;
  const èSB = idx === mano.posSB;
  const èBB = idx === mano.posBB;
  const èTurnoSuo = st.turnoDi === g.id && !g.foldato;
  const èIo = g.id === miaIdentita;

  let badge = "";
  if (èDealer) badge += `<span class="badge-mini dealer">D</span>`;
  if (èSB) badge += `<span class="badge-mini">SB</span>`;
  if (èBB) badge += `<span class="badge-mini">BB</span>`;

  let statoTesto, statoClasse;
  if (g.foldato) { statoTesto = "Passato"; statoClasse = "foldato-stato"; }
  else if (èTurnoSuo) { statoTesto = èIo ? "Tocca a te" : "Sta decidendo"; statoClasse = "turno"; }
  else if (g.allIn && !ultimaAzione[g.id]) { statoTesto = "All-in"; statoClasse = "agito"; }
  else if (ultimaAzione[g.id]) { statoTesto = ultimaAzione[g.id]; statoClasse = "agito"; }
  else { statoTesto = "Deve agire"; statoClasse = ""; }

  const classi = ["card-giocatore"];
  if (èTurnoSuo) classi.push("turno-corrente");
  if (èIo) classi.push("sono-io");
  if (g.foldato) classi.push("foldato");

  return `
    <div class="${classi.join(" ")}">
      <div class="cg-riga-nome">
        <span class="cg-nome">${g.id}</span>
        ${badge}
      </div>
      <span class="cg-fiches">${g.stack}</span>
      <span class="cg-stato ${statoClasse}">${statoTesto}</span>
    </div>`;
}

function htmlOverlayRaise(st, a) {
  const mano = st.mano;
  const min = a.minRaiseTo, max = a.maxRaiseTo;
  const mezzoPiatto = Math.round(mano.piatto / 2);
  const pienoPiatto = mano.piatto;

  const listaGiocatori = ordineDiTurnoDalDealer(mano)
    .map(g => htmlCardGiocatore(g, mano, st))
    .join("");

  return `
    <div class="overlay-giocatori">
      <div class="overlay-header">
        <span class="titolo">${NOMI_FASE[mano.fase] || mano.fase}</span>
      </div>
      ${listaGiocatori}
    </div>
    <div class="raise-panel">
      <div class="raise-vincoli">
        <span>Min <b>${min}</b></span>
        <span>Piatto <b>${pienoPiatto}</b></span>
        <span>Max <b>${max}</b></span>
      </div>
      <div class="raise-importo-riga">
        <input type="number" inputmode="numeric" id="raise-input"
               value="${raiseValoreCorrente}"
               oninput="raiseInputCambiato(this.value)">
      </div>
      <div class="raise-errore" id="raise-errore"></div>
      <div class="raise-stepper-riga">
        <button class="segno-toggle${raiseSegnoPiu ? "" : " modalita-meno"}" id="raise-segno"
                onclick="toggleSegnoRaise()">${raiseSegnoPiu ? "+" : "−"}</button>
        ${RAISE_STEP.map(s => `<button class="step-btn" onclick="applicaStepRaise(${s})">${s}</button>`).join("")}
      </div>
      <div class="raise-scorciatoie">
        <button class="scorc-btn${raiseValoreCorrente === min ? " attivo" : ""}" onclick="impostaValoreRaise(${min})">Min</button>
        <button class="scorc-btn${raiseValoreCorrente === mezzoPiatto ? " attivo" : ""}" onclick="impostaValoreRaise(${mezzoPiatto})">½ Piatto</button>
        <button class="scorc-btn${raiseValoreCorrente === pienoPiatto ? " attivo" : ""}" onclick="impostaValoreRaise(${pienoPiatto})">Piatto</button>
        <button class="scorc-btn allin${raiseValoreCorrente === max ? " attivo" : ""}" onclick="impostaValoreRaise(${max})">All-in</button>
      </div>
      <div class="raise-conferma-riga">
        <button class="btn-annulla-raise" onclick="chiudiPannelloRaise()">Annulla</button>
        <button class="btn-conferma-raise" id="raise-conferma" onclick="confermaRaise()">Rilancia ${raiseValoreCorrente}</button>
      </div>
    </div>`;
}

function raiseInputCambiato(v) {
  raiseValoreCorrente = parseInt(v);
  if (isNaN(raiseValoreCorrente)) raiseValoreCorrente = 0;
  const st = gioco ? gioco.statoUI() : ultimoStatoRicevuto;
  if (st && st.azioni) aggiornaValidazioneRaise(st.azioni);
}

function toggleSegnoRaise() {
  raiseSegnoPiu = !raiseSegnoPiu;
  const st = gioco ? gioco.statoUI() : ultimoStatoRicevuto;
  if (st) renderAzioni(st);
}

function applicaStepRaise(entita) {
  const delta = raiseSegnoPiu ? entita : -entita;
  raiseValoreCorrente = (raiseValoreCorrente || 0) + delta;
  const st = gioco ? gioco.statoUI() : ultimoStatoRicevuto;
  if (st) renderAzioni(st);
}

function impostaValoreRaise(v) {
  raiseValoreCorrente = v;
  const st = gioco ? gioco.statoUI() : ultimoStatoRicevuto;
  if (st) renderAzioni(st);
}

// Aggiorna solo il feedback di validazione (campo rosso, messaggio,
// bottone conferma) senza ridisegnare l'intero pannello — così l'utente
// può continuare a digitare senza che il campo perda il focus.
function aggiornaValidazioneRaise(a) {
  const input = document.getElementById("raise-input");
  const errore = document.getElementById("raise-errore");
  const conferma = document.getElementById("raise-conferma");
  if (!input || !errore || !conferma) return;

  const v = raiseValoreCorrente;
  let msg = "";
  if (isNaN(v) || v < a.minRaiseTo) msg = `Il rilancio minimo è ${a.minRaiseTo}`;
  else if (v > a.maxRaiseTo) msg = `Massimo ${a.maxRaiseTo} (tutto il tuo stack)`;

  input.classList.toggle("non-valido", !!msg);
  errore.textContent = msg;
  conferma.disabled = !!msg;
  conferma.textContent = `Rilancia ${isNaN(v) ? "" : v}`;
}

// In locale e in host l'azione va diretta al motore autoritativo locale.
// Da client, l'azione va solo INVIATA all'host: sarà lui a eseguirla e a
// ritrasmettere lo stato aggiornato, che farà ripartire il render qui.
function azione(tipo) {
  if (modalitaGioco === "client") {
    if (rete) rete.invia({ tipo: "azione", azione: { tipo } });
  } else {
    gioco.azioneUmano(tipo);
  }
}

function confermaRaise() {
  const v = raiseValoreCorrente;
  raisePanelAperto = false;
  if (modalitaGioco === "client") {
    if (rete) rete.invia({ tipo: "azione", azione: { tipo: "raise", importoTo: v } });
  } else {
    gioco.azioneUmano("raise", v);
  }
}

// ---- Log ----
function renderLog() {
  const el = document.getElementById("log-lista");
  el.innerHTML = logBuffer.slice(-60).reverse()
    .map(e => `<div class="${e.tipo||""}">${e.msg}</div>`).join("");
}
function apriLog() { document.getElementById("log-overlay").classList.add("aperto"); }
function chiudiLog() { document.getElementById("log-overlay").classList.remove("aperto"); }

// ---- Carta per il resoconto di fine mano, con evidenziazione opzionale
// (barretta ottone sotto) se la carta fa parte della combinazione vincente.
function cartaEsitoHTML(carta, coperta, inCombo) {
  if (coperta) return `<div class="carta-esito coperta"></div>`;
  if (!carta) return `<div class="carta-esito"></div>`;
  const V = window.PokerCarte.VALORI_SIMBOLI[carta.valore];
  const S = window.PokerCarte.SEMI_SIMBOLI[carta.seme];
  const rosso = SEMI_ROSSI.has(carta.seme) ? " rosso" : "";
  const combo = inCombo ? " in-combo" : "";
  return `<div class="carta-esito${rosso}${combo}"><span>${V}</span><span class="seme">${S}</span></div>`;
}

// Una carta è "in combo" se compare (stesso valore E stesso seme) tra le
// carte usate dalla combinazione migliore di quel giocatore.
function èInCombo(carta, carteUsate) {
  if (!carteUsate) return false;
  return carteUsate.some(c => c.valore === carta.valore && c.seme === carta.seme);
}

function htmlRigaResoconto(voce, comunitarie) {
  const èVincitore = voce.dettaglioPiatti && voce.dettaglioPiatti.length > 0;
  const carteUsate = voce.combinazione ? voce.combinazione.carteUsate : null;

  const classi = ["rg-riga"];
  if (èVincitore) classi.push("vincitore");
  if (voce.foldato) classi.push("foldato");

  let carteManoHTML, carteTavoloHTML, comboTesto, comboClasse;
  if (voce.foldato) {
    carteManoHTML = cartaEsitoHTML(null, true) + cartaEsitoHTML(null, true);
    carteTavoloHTML = "";
    comboTesto = "Lasciato";
    comboClasse = "lasciato-txt";
  } else if (!voce.combinazione) {
    // Vittoria senza showdown (tutti gli altri hanno foldato prima):
    // le carte non sono mai state mostrate, quindi restano coperte.
    carteManoHTML = cartaEsitoHTML(null, true) + cartaEsitoHTML(null, true);
    carteTavoloHTML = comunitarie.map(c => cartaEsitoHTML(c, false, false)).join("");
    comboTesto = "Non mostrate";
    comboClasse = "";
  } else {
    carteManoHTML = voce.carte.map(c => cartaEsitoHTML(c, false, èInCombo(c, carteUsate))).join("");
    carteTavoloHTML = comunitarie.map(c => cartaEsitoHTML(c, false, èInCombo(c, carteUsate))).join("");
    comboTesto = voce.combinazione.nome;
    comboClasse = "";
  }

  const nomeConCorona = èVincitore ? `<span class="corona">♛</span> ${voce.id}` : voce.id;

  let importoHTML;
  if (voce.netto > 0) {
    importoHTML = `<span class="rg-importo vinci">+${voce.netto}</span>`;
  } else if (voce.netto < 0) {
    importoHTML = `<span class="rg-importo perdi">${voce.netto}</span>`;
  } else {
    importoHTML = `<span class="rg-importo neutro">0</span>`;
  }

  // Riga di dettaglio sotto il netto: spiega DA COSA è composto quel numero,
  // così non sembra un errore quando lordo vinto e puntato sono diversi
  // dal netto (tipico con i side pot, dove si vince meno del totale dei
  // piatti perché una parte era già "propria" puntata).
  let dettaglioHTML = "";
  if (voce.dettaglioPiatti && voce.dettaglioPiatti.length > 0) {
    const piattiTesto = voce.dettaglioPiatti.length > 1
      ? voce.dettaglioPiatti.map(p => `${p.etichetta || "Piatto"} ${p.importo}`).join(" · ")
      : (voce.dettaglioPiatti[0].etichetta ? `${voce.dettaglioPiatti[0].etichetta} ${voce.dettaglioPiatti[0].importo}` : null);
    if (piattiTesto) {
      dettaglioHTML = `<span class="rg-dettaglio-piatti">Vinto ${voce.vintoLordo} (${piattiTesto}) − Puntato ${voce.puntato}</span>`;
    } else if (voce.puntato > 0) {
      dettaglioHTML = `<span class="rg-dettaglio-piatti">Vinto ${voce.vintoLordo} − Puntato ${voce.puntato}</span>`;
    }
  }

  return `
    <div class="${classi.join(" ")}">
      <div class="rg-nome-blocco">
        <span class="rg-nome">${nomeConCorona}</span>
        <span class="rg-combo ${comboClasse}">${comboTesto}</span>
      </div>
      <div class="rg-carte-mano">${carteManoHTML}</div>
      <div class="rg-separatore"></div>
      <div class="rg-carte-tavolo">${carteTavoloHTML}</div>
      <div class="rg-importo-blocco">
        ${importoHTML}
        ${dettaglioHTML}
      </div>
    </div>`;
}

function mostraFineMano(mano) {
  const barra = document.getElementById("barra-fine");
  const contenitore = document.getElementById("resoconto-mano");

  if (mano.resocontoMano && mano.resocontoMano.length) {
    contenitore.innerHTML = mano.resocontoMano
      .map(voce => htmlRigaResoconto(voce, mano.comunitarie))
      .join("");
  } else {
    // Fallback difensivo, non dovrebbe mai servire: resocontoMano è sempre
    // popolato da _assegnaPiatti()/_assegnaPiattoSenzaShowdown().
    contenitore.innerHTML = `<div class="rg-riga"><span class="rg-combo">Mano conclusa.</span></div>`;
  }

  document.getElementById("msg-fine-partita").textContent = "";
  // Solo l'host decide quando parte la mano successiva: il client vede
  // il risultato ma non il pulsante per avanzare.
  document.getElementById("btn-prossima").style.display = (modalitaGioco === "client") ? "none" : "";
  barra.style.display = "flex";
}

function mostraFinePartita(vincitore) {
  const barra = document.getElementById("barra-fine");
  document.getElementById("msg-fine-partita").textContent = `🏆 Partita finita — vince ${vincitore}`;
  document.getElementById("btn-prossima").style.display = "none";
  document.getElementById("pannello-azioni").innerHTML = "";
  barra.style.display = "flex";
}
</script>
